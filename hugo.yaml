baseURL: "https://four1er.github.io/llm-infra-daily/"
title: "LLM Infrastructure 日报"
languageCode: zh-cn
defaultContentLanguage: zh
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS

params:
  env: production
  description: "每天早上 9:00 更新：最近 24 小时 LLM infrastructure 领域的技术报告、论文、行业新闻、X 动态与热点，中文汇总，每条附原文链接。"
  author: "four1er"
  mainSections:
    - posts

menu:
  main:
    - identifier: archives
      name: 归档
      url: /posts/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: github
      name: GitHub
      url: https://github.com/four1er/llm-infra-daily
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
